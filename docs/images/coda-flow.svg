<?xml version="1.0" encoding="UTF-8"?>
<!--
  Codayak request flow diagram.

  Authored by hand as SVG rather than generated from Mermaid so that it can be
  rendered anywhere without a JavaScript engine: the in-app Help viewer
  (WebView2), GitHub's Markdown renderer, and the Techniche Labs website all
  display it natively.

  Theme-neutral by design: the background is transparent and every label sits
  on a solid filled shape, so the diagram is legible on both the dark and light
  application themes and on a white printed page. Connector strokes use a
  mid-tone grey that reads against either background.

  All non-ASCII glyphs are written as XML numeric character references so the
  file cannot be corrupted by a mis-detected encoding.

  CANONICAL COPY NOTE: this file is kept in step with the copy on the Techniche
  Labs website (TechnicheLabs/images/coda/coda-flow.svg). If you change one,
  change the other.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" width="1060" height="500" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">How a request flows through Codayak</title>
  <desc id="flowDesc">Your plain-language message goes to Codayak on your Windows desktop, which calls your chosen LLM provider. The provider requests tools that run locally on your machine: reading and mapping the repository, patching and creating files, building, testing and running, querying a real database, and driving Chrome or a desktop UI. The Trust Engine then builds, tests, scans and checks the result against the specification, and the answer, diff and report come back to you. Lessons learnt are written to a local learning memory and recalled next time.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B0" />
    </marker>
  </defs>

  <g font-family="Segoe UI, Selawik, Arial, sans-serif" text-anchor="middle">

    <!-- Top row: you, the app, the model -->
    <rect x="40" y="40" width="150" height="60" rx="8" fill="#0F4C75" stroke="#1A9FD4" stroke-width="1.5" />
    <text x="115" y="66" font-size="16" font-weight="600" fill="#FFFFFF">You</text>
    <text x="115" y="85" font-size="11" fill="#B8DCF0">plain-language chat</text>

    <rect x="250" y="40" width="190" height="60" rx="8" fill="#0F4C75" stroke="#1A9FD4" stroke-width="1.5" />
<text x="345" y="66" font-size="16" font-weight="600" fill="#FFFFFF">Codayak</text>
    <text x="345" y="85" font-size="11" fill="#B8DCF0">Windows desktop</text>

    <rect x="500" y="40" width="230" height="60" rx="8" fill="#0F4C75" stroke="#1A9FD4" stroke-width="1.5" />
    <text x="615" y="66" font-size="15" font-weight="600" fill="#FFFFFF">Your LLM provider</text>
    <text x="615" y="85" font-size="11" fill="#B8DCF0">7 supported &#183; your API key</text>

    <!-- Tools that run on the user's own machine -->
    <rect x="250" y="150" width="740" height="150" rx="10" fill="none" stroke="#5C93B0" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="620" y="174" font-size="13" font-weight="600" fill="#1A9FD4">Tools &#8212; run locally on your machine</text>

    <rect x="263" y="205" width="132" height="70" rx="6" fill="#14405C" stroke="#3C7B9C" stroke-width="1" />
    <text x="329" y="235" font-size="12" fill="#FFFFFF">Read and map</text>
    <text x="329" y="252" font-size="12" fill="#FFFFFF">the repo</text>

    <rect x="408" y="205" width="132" height="70" rx="6" fill="#14405C" stroke="#3C7B9C" stroke-width="1" />
    <text x="474" y="230" font-size="12" fill="#FFFFFF">Patch and create</text>
    <text x="474" y="247" font-size="12" fill="#FFFFFF">files</text>
    <text x="474" y="263" font-size="10" fill="#9FCBE2">auto-backed-up</text>

    <rect x="553" y="205" width="132" height="70" rx="6" fill="#14405C" stroke="#3C7B9C" stroke-width="1" />
    <text x="619" y="244" font-size="12" fill="#FFFFFF">Build &#183; test &#183; run</text>

    <rect x="698" y="205" width="132" height="70" rx="6" fill="#14405C" stroke="#3C7B9C" stroke-width="1" />
    <text x="764" y="235" font-size="12" fill="#FFFFFF">SQL on a real</text>
    <text x="764" y="252" font-size="12" fill="#FFFFFF">database</text>

    <rect x="843" y="205" width="132" height="70" rx="6" fill="#14405C" stroke="#3C7B9C" stroke-width="1" />
    <text x="909" y="235" font-size="12" fill="#FFFFFF">Chrome and</text>
    <text x="909" y="252" font-size="12" fill="#FFFFFF">desktop UI</text>

    <!-- Verification and the reply -->
    <rect x="250" y="350" width="250" height="70" rx="8" fill="#1A9FD4" stroke="#7FCDEC" stroke-width="1.5" />
    <text x="375" y="378" font-size="15" font-weight="600" fill="#FFFFFF">Trust Engine</text>
    <text x="375" y="398" font-size="11" fill="#EAF7FE">build + test + scan + spec</text>

    <rect x="560" y="350" width="250" height="70" rx="8" fill="#0F4C75" stroke="#1A9FD4" stroke-width="1.5" />
    <text x="685" y="380" font-size="15" font-weight="600" fill="#FFFFFF">Answer, diff and report</text>
    <text x="685" y="399" font-size="11" fill="#B8DCF0">every change reviewable</text>

    <rect x="840" y="350" width="180" height="70" rx="8" fill="none" stroke="#5C93B0" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="930" y="378" font-size="13" font-weight="600" fill="#1A9FD4">Learning memory</text>
    <text x="930" y="397" font-size="11" fill="#5C93B0">local, on your machine</text>

    <!-- Connectors -->
    <g stroke="#8FA3B0" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
      <path d="M 190 70 H 244" />
      <path d="M 440 70 H 494" />
      <path d="M 615 100 V 144" />
      <path d="M 375 300 V 344" />
      <path d="M 500 385 H 554" />
      <path d="M 585 420 V 470 H 115 V 106" />
    </g>

    <g stroke="#5C93B0" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)">
      <path d="M 925 300 V 344" />
      <path d="M 1020 385 H 1042 V 20 H 345 V 34" />
    </g>

    <g font-size="10.5" fill="#8FA3B0">
      <text x="640" y="126" text-anchor="start">tool calls</text>
      <text x="527" y="377">verdict</text>
      <text x="350" y="463">back to you, with the evidence</text>
      <text x="935" y="326" text-anchor="start">lessons learnt</text>
      <text x="690" y="15">recalled next time</text>
    </g>

  </g>
</svg>
